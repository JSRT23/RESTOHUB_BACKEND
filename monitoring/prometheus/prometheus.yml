global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "menu_service"
    static_configs:
      - targets: ["menu_service:8000"]
    metrics_path: "/metrics"

  - job_name: "staff_service"
    static_configs:
      - targets: ["staff_service:8000"]
    metrics_path: "/metrics"

  - job_name: "order_service"
    static_configs:
      - targets: ["order_service:8000"]
    metrics_path: "/metrics"

  - job_name: "inventory_service"
    static_configs:
      - targets: ["inventory_service:8000"]
    metrics_path: "/metrics"

  - job_name: "loyalty_service"
    static_configs:
      - targets: ["loyalty_service:8000"]
    metrics_path: "/metrics"

  - job_name: "auth_service"
    static_configs:
      - targets: ["auth_service:8000"]
    metrics_path: "/metrics"

  - job_name: "gateway_service"
    static_configs:
      - targets: ["gateway_service:8000"]
    metrics_path: "/metrics"
