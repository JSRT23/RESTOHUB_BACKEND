name: Backend CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [juan-backend]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8
      - name: flake8
        run: |
          flake8 services/ \
            --select=E9,F63,F7,F82 \
            --exclude=migrations,__pycache__,.venv \
            --show-source --statistics

  test-auth:
    name: "Test auth_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/auth_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/auth_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-menu:
    name: "Test menu_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/menu_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/menu_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-order:
    name: "Test order_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/order_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/order_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-inventory:
    name: "Test inventory_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/inventory_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/inventory_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-loyalty:
    name: "Test loyalty_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/loyalty_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/loyalty_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-staff:
    name: "Test staff_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/staff_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/staff_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  test-gateway:
    name: "Test gateway_service"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/gateway_service
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/gateway_service/requirements.txt
      - run: pip install -r requirements.txt && pip install -r requirements-test.txt
      - run: pytest --tb=short -q

  all-tests-passed:
    name: "Todos los tests OK"
    runs-on: ubuntu-latest
    needs:
      [
        test-auth,
        test-menu,
        test-order,
        test-inventory,
        test-loyalty,
        test-staff,
        test-gateway,
      ]
    steps:
      - run: echo "Todos los tests pasaron"

  deploy:
    name: "Deploy a Render"
    runs-on: ubuntu-latest
    needs: all-tests-passed
    if: github.ref == 'refs/heads/juan-backend' && github.event_name == 'push'
    steps:
      - name: Deploy auth_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_AUTH }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_AUTH_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy menu_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_MENU }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_MENU_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy order_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_ORDER }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_ORDER_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy inventory_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_INVENTORY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_INVENTORY_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy loyalty_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_LOYALTY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_LOYALTY_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy staff_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_STAFF }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_STAFF_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy gateway_service
        run: |
          RESP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY_GATEWAY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_GATEWAY_SERVICE_ID }}/deploys")
          echo "HTTP $RESP: $(cat /tmp/resp.txt)"
          if [ "$RESP" -ge 400 ]; then exit 1; fi

      - name: Deploy completado
        run: echo "Deploy exitoso — ${{ github.sha }} por ${{ github.actor }}"

  monitoreo:
    name: "Verificar monitoreo Grafana"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/juan-backend' && github.event_name == 'push'
    steps:
      - name: Esperar que los servicios levanten
        run: sleep 60

      - name: Verificar Grafana Cloud
        run: |
          RESP=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/api/v1/query?query=up")
          if echo "$RESP" | grep -q '"status":"success"'; then
            echo "✅ Grafana Cloud OK"
          else
            echo "⚠️  Grafana no responde: $RESP"
            exit 1
          fi

      - name: Verificar métricas Django
        run: |
          RESP=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/api/v1/query?query=django_http_requests_total_requests_total")
          if echo "$RESP" | grep -q '"result":\[\]'; then
            echo "⚠️  Sin métricas Django aún — Alloy puede estar iniciando"
          elif echo "$RESP" | grep -q '"status":"success"'; then
            COUNT=$(echo "$RESP" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(len(d.get('data',{}).get('result',[])))
          " 2>/dev/null || echo "0")
            echo "✅ Métricas Django activas — $COUNT series"
          fi

      - name: Verificar targets UP
        run: |
          RESP=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/api/v1/query?query=count(up)")
          if echo "$RESP" | grep -q '"status":"success"'; then
            TOTAL=$(echo "$RESP" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          r=d.get('data',{}).get('result',[])
          print(r[0].get('value',[None,'0'])[1] if r else '0')
          " 2>/dev/null || echo "0")
            echo "✅ Targets activos: $TOTAL"
          fi

      - name: Resumen
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Grafana: https://restohub.grafana.net"
          echo "  Alloy:   https://restohub-alloy.onrender.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
